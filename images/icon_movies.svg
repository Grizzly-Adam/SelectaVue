<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" fill="#024c48"/>
  <!-- Film strip at bottom -->
  <rect x="8" y="154" width="184" height="36" rx="4" fill="#8fcdc1"/>
  <rect x="18" y="161" width="14" height="22" rx="2" fill="#024c48"/>
  <rect x="44" y="161" width="14" height="22" rx="2" fill="#024c48"/>
  <rect x="70" y="161" width="14" height="22" rx="2" fill="#024c48"/>
  <rect x="96" y="161" width="14" height="22" rx="2" fill="#024c48"/>
  <rect x="122" y="161" width="14" height="22" rx="2" fill="#024c48"/>
  <rect x="148" y="161" width="14" height="22" rx="2" fill="#024c48"/>
  <!-- Reel disk -->
  <circle cx="100" cy="80" r="66" fill="#E8B84B"/>
  <!-- Sprocket holes (8 around perimeter at r≈66) -->
  <circle cx="100" cy="17" r="9" fill="#024c48"/>
  <circle cx="147" cy="33" r="9" fill="#024c48"/>
  <circle cx="163" cy="80" r="9" fill="#024c48"/>
  <circle cx="147" cy="127" r="9" fill="#024c48"/>
  <circle cx="100" cy="143" r="9" fill="#024c48"/>
  <circle cx="53" cy="127" r="9" fill="#024c48"/>
  <circle cx="37" cy="80" r="9" fill="#024c48"/>
  <circle cx="53" cy="33" r="9" fill="#024c48"/>
  <!-- Three spokes radiating from center -->
  <rect x="97" y="30" width="6" height="32" fill="#024c48"/>
  <rect x="97" y="30" width="6" height="32" fill="#024c48" transform="rotate(120,100,80)"/>
  <rect x="97" y="30" width="6" height="32" fill="#024c48" transform="rotate(240,100,80)"/>
  <!-- Hub -->
  <circle cx="100" cy="80" r="18" fill="#024c48"/>
  <circle cx="100" cy="80" r="9" fill="#E8B84B"/>
</svg>