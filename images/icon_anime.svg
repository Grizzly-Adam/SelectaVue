  <polygon points="100,60 52,34 62,14" fill="#E8B84B"/>
  <polygon points="100,60 148,34 138,14" fill="#E8B84B"/>
  <polygon points="100,60 24,82 18,58" fill="#E8B84B"/>
  <polygon points="100,60 176,82 182,58" fill="#E8B84B"/>
  <!-- Sun circle -->
