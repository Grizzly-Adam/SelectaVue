<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" fill="#024c48"/>
  <!-- TV body -->
  <rect x="30" y="55" width="140" height="100" rx="8" fill="#8fcdc1"/>
  <!-- Screen -->
  <rect x="45" y="68" width="110" height="72" rx="3" fill="#024c48"/>
  <!-- Antenna left -->
  <line x1="70" y1="55" x2="50" y2="22" stroke="#E8B84B" stroke-width="6" stroke-linecap="round"/>
  <!-- Antenna right -->
  <line x1="130" y1="55" x2="150" y2="22" stroke="#E8B84B" stroke-width="6" stroke-linecap="round"/>
  <!-- Stand -->
  <rect x="80" y="155" width="40" height="10" rx="3" fill="#8fcdc1"/>
  <rect x="65" y="162" width="70" height="8" rx="4" fill="#8fcdc1"/>
  <!-- Screen star/signal -->
  <circle cx="100" cy="104" r="18" fill="#E8B84B"/>
  <circle cx="100" cy="104" r="9" fill="#024c48"/>
</svg>